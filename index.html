<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FunLessons – Flashcards 1 (Corrected)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* --- ESTILOS VISUALES ORIGINALES --- */
:root {
    --primary: #ff7043;
    --secondary: #ffca28;
    --accent: #26a69a;
    --bg-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
}

body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    padding: 15px;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(255, 112, 67, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

header {
    background: var(--primary);
    color: #fff;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.logo { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; margin: 0; }

.controls-top {
    padding: 15px;
    background: #fff;
    border-bottom: 2px solid #eee;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

/* Panel de selección múltiple */
#multiSelectContainer {
    display: none;
    background: #f0f2f1;
    padding: 15px;
    border-radius: 15px;
    margin: 10px;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    border: 2px solid var(--accent);
}

.check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    color: #444;
}

select {
    padding: 10px 20px;
    border-radius: 25px;
    border: 2px solid var(--accent);
    font-size: 1rem;
    font-weight: bold;
    color: var(--accent);
    outline: none;
    cursor: pointer;
    background: #e0f2f1;
}

/* --- ESCENARIO DE LA FLASHCARD --- */
.scene {
    width: 100%;
    height: 350px;
    perspective: 1000px;
    margin: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 280px;
    height: 320px;
    position: relative;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
}

.card.is-flipped { transform: rotateY(180deg); }

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    border: 4px solid #fff;
    padding: 10px;
    box-sizing: border-box;
}

.card-face.front { background: #fff; border-color: var(--secondary); }
.card-face.back { background: var(--accent); color: white;
    transform: rotateY(180deg); border-color: var(--accent); }

.emoji-img { 
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8rem; 
    line-height: 1;
}

.emoji-img img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
}

.word-text { font-size: 2.5rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
.tap-hint { font-size: 0.9rem; color: #aaa; margin-top: 10px; opacity: 0.7; }
.tap-hint.white { color: rgba(255,255,255,0.8); }

.nav-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: #f9f9f9;
}

.nav-btn {
    background: white;
    border: 2px solid var(--primary);
    color: var(--primary);
    width: 50px; height: 50px;
    border-radius: 50%;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}

.nav-btn:disabled { border-color: #ccc; color: #ccc; }
.counter { font-size: 1.1rem; font-weight: bold; color: #777; background: #eee; padding: 5px 15px; border-radius: 15px; }

.sound-btn-small {
    background: rgba(255,255,255,0.2);
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50%;
    width: 45px; height: 45px;
    cursor: pointer;
    font-size: 1.2rem;
}
</style>
</head>
<body>

<div class="app">
    <header><div class="logo">⚡ Flashcards 1 <span>🇬🇧</span></div></header>

    <div class="controls-top">
        <div style="display:flex; align-items:center; gap:10px;">
            <label style="font-weight:bold; color:#666;">Topic:</label>
            <select id="categorySelect" onchange="toggleMultiSelect()">
                <option value="ALL">🌟 All Topics</option>
                <option value="MIX_TOPICS">🌪️ Mix Topics</option>
                <option value="COLOURS">🎨 Colours</option>
                <option value="NUMBERS">🔢 Numbers</option>
                <option value="FAMILY">👨‍👩‍👧 Family</option>
                <option value="FEELINGS">❤️ Feelings</option>
                <option value="SCHOOL">🎒 School</option>
                <option value="ANIMALS">🐶 Animals</option>
                <option value="TOYS">⚽ Toys</option>
                <option value="BODY">💪 Body</option>
                <option value="FOOD">🍎 Food</option>
            </select>
        </div>

        <div id="multiSelectContainer">
            <label class="check-item"><input type="checkbox" value="COLOURS">🎨 Colours</label>
            <label class="check-item"><input type="checkbox" value="NUMBERS">🔢 Numbers</label>
            <label class="check-item"><input type="checkbox" value="FAMILY">👨‍👩‍👧 Family</label>
            <label class="check-item"><input type="checkbox" value="FEELINGS">❤️ Feelings</label>
            <label class="check-item"><input type="checkbox" value="SCHOOL">🎒 School</label>
            <label class="check-item"><input type="checkbox" value="ANIMALS">🐶 Animals</label>
            <label class="check-item"><input type="checkbox" value="TOYS">⚽ Toys</label>
            <label class="check-item"><input type="checkbox" value="BODY">💪 Body</label>
            <label class="check-item"><input type="checkbox" value="FOOD">🍎 Food</label>
            <button onclick="applyAndClose()" style="grid-column: span 2; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 15px; font-weight: bold; cursor: pointer;">Apply Mix</button>
        </div>
    </div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face front">
                <div class="emoji-img" id="cardImg">❓</div>
                <div class="tap-hint">👆 Tap to flip</div>
            </div>
            <div class="card-face back">
                <div class="word-text" id="cardWord">WORD</div>
                <button class="sound-btn-small" onclick="event.stopPropagation(); playCurrentAudio()">🔊</button>
                <div class="tap-hint white">👆 Tap to flip back</div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevCard()">⬅️</button>
        <div class="counter" id="counterDisplay">1 / 10</div>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">➡️</button>
    </div>
</div>

<script>
const vocab = [
 {en:"APPLE", es:"MANZANA", img:"🍎", cat:"FOOD"},

 {en:"CAKE", es:"PASTEL", img:"🍰", cat:"FOOD"},
 {en:"CHEESE", es:"QUESO", img:"🧀", cat:"FOOD"},

 {en:"WATER", es:"AGUA", img:"💧", cat:"FOOD"},
 {en:"YOGURT", img:"yogurt.png", isImage: true, cat:"FOOD"},
 {en:"ARM", es:"BRAZO", img:"💪", cat:"BODY"},
 {en:"HAIR", es:"PELO", img:"💇", cat:"BODY"},
 {en:"HAND", es:"MANO", img:"🖐️", cat:"BODY"},
 {en:"HEAD", es:"CABEZA", img:"👤", cat:"BODY"},
 {en:"KNEE", img:"knee.png", isImage: true, cat:"BODY"},
 {en:"EYES", img:"eyes.png", isImage: true, cat:"BODY"},
 {en:"FEET", img:"feet.png", isImage: true, cat:"BODY"},
 {en:"LEG", es:"PIERNA", img:"🦵", cat:"BODY"},
 {en:"MOUTH", es:"BOCA", img:"👄", cat:"BODY"},
 {en:"NOSE", es:"NARIZ", img:"👃", cat:"BODY"},
 {en:"TOES", img:"toes.png", isImage: true, cat:"BODY"},
 {en:"BABY", es:"BEBÉ", img:"👶", cat:"FAMILY"},
 {en:"BROTHER", es:"HERMANO", img:"👦", cat:"FAMILY"},
 {en:"DAD", es:"PAPÁ", img:"👨", cat:"FAMILY"},
 {en:"MUM", es:"MAMÁ", img:"👩", cat:"FAMILY"},
 {en:"SISTER", es:"HERMANA", img:"👧", cat:"FAMILY"},
 {en:"GRANNY", es:"ABUELA", img:"👵", cat:"FAMILY"},
 {en:"GRANDAD", es:"ABUELO", img:"👴", cat:"FAMILY"},
 {en:"BIN", es:"PAPELERA", img:"🗑️", cat:"SCHOOL"},
 {en:"BOOK", es:"LIBRO", img:"📖", cat:"SCHOOL"},
 {en:"CHAIR", es:"SILLA", img:"🪑", cat:"SCHOOL"},
 {en:"CRAYON", es:"CERA", img:"🖍️", cat:"SCHOOL"},
 {en:"GLUE", img:"glue.png", isImage: true, cat:"SCHOOL"},
 {en:"PEN", es:"BOLÍGRAFO", img:"🖊️", cat:"SCHOOL"},
 {en:"PENCIL", es:"LÁPIZ", img:"✏️", cat:"SCHOOL"},
 {en:"PENCIL CASE", img:"pencil case.png", isImage: true, cat:"SCHOOL"},
 {en:"RUBBER", img:"rubber.png", isImage: true, cat:"SCHOOL"},
 {en:"RULER", es:"REGLA", img:"📏", cat:"SCHOOL"},
 {en:"SCHOOL BAG", es:"MOCHILA", img:"🎒", cat:"SCHOOL"},
 {en:"SHARPENER", img:"sharpener.png", isImage: true, cat:"SCHOOL"},
 {en:"CAT", es:"GATO", img:"🐱", cat:"ANIMALS"},
 {en:"DOG", es:"PERRO", img:"🐶", cat:"ANIMALS"},
 {en:"MOUSE", es:"RATÓN", img:"🐭", cat:"ANIMALS"},
 {en:"PARROT", es:"LORO", img:"🦜", cat:"ANIMALS"},
 {en:"RABBIT", es:"CONEJO", img:"🐰", cat:"ANIMALS"},
 {en:"SNAKE", es:"SERPIENTE", img:"🐍", cat:"ANIMALS"},
 {en:"SPIDER", es:"ARAÑA", img:"🕷️", cat:"ANIMALS"},
 {en:"FISH", es:"PEZ", img:"🐠", cat:"ANIMALS"},
 {en:"MONKEY", es:"MONO", img:"🐒", cat:"ANIMALS"},
 {en:"HORSE", es:"CABALLO", img:"🐎", cat:"ANIMALS"},

 {en:"TRAIN", es:"TREN", img:"🚂", cat:"TOYS"},
 {en:"DINOSAUR", es:"DINOSAURIO", img:"🦖", cat:"TOYS"},
 {en:"KITE", es:"COMETA", img:"🪁", cat:"TOYS"},
 {en:"BIG", img:"big.png", isImage: true, cat:"TOYS"},
 {en:"SMALL", img:"small.png", isImage: true, cat:"TOYS"},
 {en:"BORED", es:"ABURRIDO", img:"😪", cat:"FEELINGS"},
 {en:"HAPPY", es:"FELIZ", img:"😊", cat:"FEELINGS"},
 {en:"HUNGRY", es:"HAMBRIENTO", img:"🤤", cat:"FEELINGS"},
 {en:"SAD", es:"TRISTE", img:"😢", cat:"FEELINGS"},
 {en:"SCARED", es:"ASUSTADO", img:"😨", cat:"FEELINGS"},
 {en:"BLUE", es:"AZUL", img:"🔵", cat:"COLOURS"},
 {en:"PINK", es:"ROSA", img:"🌸", cat:"COLOURS"},
 {en:"PURPLE", es:"MORADO", img:"💜", cat:"COLOURS"},
 {en:"YELLOW", es:"AMARILLO", img:"💛", cat:"COLOURS"},
 {en:"RED", es:"ROJO", img:"🔴", cat:"COLOURS"},
 {en:"GREEN", es:"VERDE", img:"🟢", cat:"COLOURS"},
 {en:"BLACK", es:"NEGRO", img:"⚫", cat:"COLOURS"},
 {en:"WHITE", es:"BLANCO", img:"⚪", cat:"COLOURS"},
 {en:"BROWN", es:"MARRÓN", img:"🟤", cat:"COLOURS"},
 {en:"GREY", es:"GRIS", img:"🩶", cat:"COLOURS"},
 {en:"ORANGE", es:"NARANJA", img:"🟠", cat:"COLOURS"},
 {en:"ONE", es:"UNO", img:"1️⃣", cat:"NUMBERS"},
 {en:"TWO", es:"DOS", img:"2️⃣", cat:"NUMBERS"},
 {en:"THREE", es:"TRES", img:"3️⃣", cat:"NUMBERS"},
 {en:"FOUR", es:"CUATRO", img:"4️⃣", cat:"NUMBERS"},
 {en:"FIVE", es:"CINCO", img:"5️⃣", cat:"NUMBERS"},
 {en:"SIX", es:"SEIS", img:"6️⃣", cat:"NUMBERS"},
 {en:"SEVEN", es:"SIETE", img:"7️⃣", cat:"NUMBERS"},
 {en:"EIGHT", es:"OCHO", img:"8️⃣", cat:"NUMBERS"},
 {en:"NINE", es:"NUEVE", img:"9️⃣", cat:"NUMBERS"},
 {en:"TEN", es:"DIEZ", img:"🔟", cat:"NUMBERS"},
];

let currentList = [], currentIndex = 0, isFlipped = false;
const ui = {
    card: document.getElementById("flashcard"),
    img: document.getElementById("cardImg"),
    word: document.getElementById("cardWord"),
    counter: document.getElementById("counterDisplay"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    multiPanel: document.getElementById("multiSelectContainer")
};

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function toggleMultiSelect() {
    const cat = document.getElementById("categorySelect").value;
    ui.multiPanel.style.display = (cat === "MIX_TOPICS") ? "grid" : "none";
    if (cat !== "MIX_TOPICS") changeCategory();
}

function applyAndClose() {
    changeCategory();
    ui.multiPanel.style.display = "none";
}

function changeCategory() {
    const cat = document.getElementById("categorySelect").value;
    let tempList = [];

    if (cat === "ALL") {
        tempList = [...vocab];
    } else if (cat === "MIX_TOPICS") {
        const checkedValues = Array.from(ui.multiPanel.querySelectorAll('input:checked')).map(cb => cb.value);
        tempList = vocab.filter(item => checkedValues.includes(item.cat));
    } else {
        tempList = vocab.filter(item => item.cat === cat);
    }

    if (tempList.length === 0) {
        alert("Please select at least one topic!");
        return;
    }
    
    currentList = shuffleArray(tempList);
    currentIndex = 0;
    resetCardFace();
    updateUI();
}

function updateUI() {
    if(currentList.length === 0) return;
    const item = currentList[currentIndex];
    if (item.isImage) {
        ui.img.innerHTML = `<img src="${item.img}" alt="${item.en}">`;
    } else {
        ui.img.innerHTML = item.img;
    }

    ui.word.textContent = item.en;
    ui.counter.textContent = `${currentIndex + 1} / ${currentList.length}`;
    ui.prevBtn.disabled = (currentIndex === 0);
    ui.nextBtn.disabled = (currentIndex === currentList.length - 1);
}

function flipCard() {
    isFlipped = !isFlipped;
    ui.card.classList.toggle("is-flipped", isFlipped);
    if(isFlipped) setTimeout(playCurrentAudio, 200);
}

function resetCardFace() { 
    isFlipped = false;
    ui.card.classList.remove("is-flipped"); 
}

function nextCard() { 
    if(currentIndex < currentList.length - 1) { 
        currentIndex++; 
        resetCardFace(); 
        setTimeout(updateUI, 150);
    } 
}

function prevCard() { 
    if(currentIndex > 0) { 
        currentIndex--; 
        resetCardFace(); 
        setTimeout(updateUI, 150); 
    } 
}

function playCurrentAudio() {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentList[currentIndex].en);
    utterance.lang = "en-GB"; 
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

changeCategory();
</script>
</body>
</html>
