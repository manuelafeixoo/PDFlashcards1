<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Year 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
:root {
    --primary: #6200ea;
    --secondary: #00e5ff; 
    --header-bg: #efdaf7;
    --bg-gradient: linear-gradient(135deg, #fff9c4 0%, #f8bbd0 100%);
    --color-img-mode: #ff9800;
    --color-word-mode: #2196f3;
    --color-exam-mode: #90ee90;
    --color-success: #00c853; 
    --color-error: #ff1744;
}

body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg-gradient); min-height: 100vh;
    padding: 10px; display: flex; flex-direction: column; align-items: center;
}

.app {
    width: 100%; max-width: 500px;
    background: rgba(255, 255, 255, 0.98); border-radius: 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15); overflow: hidden;
    display: flex; flex-direction: column;
}

header { 
    background: var(--header-bg); 
    color: #333; padding: 12px; 
    text-align: center; display: flex; justify-content: center; 
    align-items: center; gap: 8px; font-weight: 900; 
    font-size: 1.5rem;
    white-space: nowrap;
}

/* Modificación: Iconos del Header circulares y blancos */
header img { 
    width: 30px; 
    height: 30px; 
    background: white; 
    border-radius: 50%; 
    object-fit: contain;
    padding: 2px;
}

.exam-bar { 
    background: #424242; color: white; padding: 10px 20px; 
    display: none; justify-content: space-between; align-items: center;
}

.progress-container { width: 100%; height: 8px; background: #f5f5f5; }
.progress-bar { width: 0%; height: 100%; background: var(--secondary); transition: width 0.4s; }

.mode-selector { display: flex; padding: 10px; gap: 8px; background: #fff; border-bottom: 1px solid #eee; }
.mode-btn { 
    flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 15px; 
    background: #fafafa; color: #757575; font-weight: 800; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; gap: 5px; 
    transition: all 0.3s; font-size: 0.75rem;
}

/* Modificación: Iconos de los botones de modo circulares y blancos */
.mode-btn img { 
    width: 22px; 
    height: 22px; 
    object-fit: contain; 
    background: white; 
    border-radius: 50%; 
    padding: 2px;
}

.mode-btn.active.img-en { background: var(--color-img-mode); color: white; border-color: #f57c00; }
.mode-btn.active.en-img { background: var(--color-word-mode); color: white; border-color: #1976d2; }
.mode-btn.exam.active { background: var(--color-exam-mode); color: #2e7d32; border-color: #81c784; }

.controls-top { padding: 15px; text-align: center; }
select { 
    padding: 10px; border-radius: 20px; border: 2px solid var(--primary); 
    font-weight: 800; width: 95%; cursor: pointer; color: var(--primary); background: #f3e5f5;
}

.mix-panel { 
    display: none; background: #fffde7; padding: 15px;
    margin: 0 15px 15px 15px; border-radius: 20px; text-align: left; 
    max-height: 180px; overflow-y: auto; font-size: 0.85rem; border: 2px dashed #fdd835;
}

.scene { width: 100%; height: 350px; perspective: 1000px; display: flex; justify-content: center; align-items: center; }
.card { width: 290px; height: 280px; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
.card.is-flipped { transform: rotateY(180deg); }

.card-face { 
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
    border-radius: 35px; display: flex; flex-direction: column; align-items: center; 
    justify-content: center; padding: 25px; box-sizing: border-box; border: 8px solid #fff;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
}
.face-img { background: #ffffff; } 
.face-word { background: var(--primary); color: white; }
.card-face.back { transform: rotateY(180deg); }

.main-img { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 8rem; }
.main-img img { max-width: 95%; max-height: 95%; object-fit: contain; background: transparent; mix-blend-mode: multiply; }

.exam-actions { display: none; gap: 20px; margin-top: 20px; }
.action-btn { border: none; border-radius: 50%; width: 65px; height: 65px; color: white; font-size: 2rem; cursor: pointer; }

.nav-controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 35px; background: #fff; border-top: 1px solid #eee; }
.nav-btn { background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
.counter { font-weight: 800; color: var(--primary); font-size: 1rem; }
</style>
</head>
<body>

<div class="app">
    <div class="exam-bar" id="examBar">
        <span>⏱️ <span id="timer">00:00</span></span>
        <span>🔥 <span id="streak">0</span></span>
        <span>✅ <span id="scoreCorrect">0</span> | ❌ <span id="scoreWrong">0</span></span>
    </div>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>

    <header>
        <img src="english.png"> PICTURE DICTIONARY 1 <img src="english.png">
    </header>

    <div class="mode-selector">
        <button id="btnImgEn" class="mode-btn active img-en" onclick="setMode('IMG-EN')">
            <img src="camera.png"> ➔ <img src="english.png">
        </button>
        <button id="btnEnImg" class="mode-btn en-img" onclick="setMode('EN-IMG')">
            <img src="english.png"> ➔ <img src="camera.png">
        </button>
        <button id="btnExam" class="mode-btn exam" onclick="toggleExamMode()">🎓 EXAM</button>
    </div>

    <div class="controls-top">
        <select id="categorySelect" onchange="handleCategoryChange()">
            <option value="ALL">🌟 All Topics</option>
            <option value="MIXED">🧩 Mixed Topics</option>
        </select>
    </div>

    <div id="mixPanel" class="mix-panel">
        <strong>Pick topics to mix:</strong><hr>
        <div id="mixCheckboxes"></div>
        <button style="width:100%; margin-top:10px; background:var(--primary); color:white; border:none; padding:8px; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="changeCategory()">Start Learning!</button>
    </div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face front" id="faceFront">
                <div class="main-img" id="imgFront"></div>
                <div class="main-text" style="font-size:2.3rem; font-weight:900;" id="textFront"></div>
            </div>
            <div class="card-face back" id="faceBack">
                <div class="main-img" id="imgBack"></div>
                <div class="main-text" style="font-size:2.3rem; font-weight:900;" id="textBack"></div>
                <div id="examActions" class="exam-actions">
                    <button class="action-btn btn-no" onclick="event.stopPropagation(); markResult(false)">❌</button>
                    <button class="action-btn btn-yes" onclick="event.stopPropagation(); markResult(true)">✅</button>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevCard()">⬅️</button>
        <div class="counter" id="counterDisplay">0 / 0</div>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">➡️</button>
    </div>
</div>

<script>
/* Vocabulario y Lógica se mantienen igual */
const vocab = [
    {en:"APPLE", img:"🍎", cat:"FOOD"}, {en:"BANANA", img:"🍌", cat:"FOOD"}, {en:"CAKE", img:"🍰", cat:"FOOD"},
    {en:"CHEESE", img:"🧀", cat:"FOOD"}, {en:"CHICKEN", img:"🍗", cat:"FOOD"}, {en:"JUICE", img:"🧃", cat:"FOOD"},
    {en:"MEAT", img:"🥩", cat:"FOOD"}, {en:"MILK", img:"🥛", cat:"FOOD"}, {en:"ORANGE", img:"🍊", cat:"FOOD"},
    {en:"PEAR", img:"🍐", cat:"FOOD"}, {en:"SALAD", img:"🥗", cat:"FOOD"}, {en:"SOUP", img:"🍲", cat:"FOOD"},
    {en:"WATER", img:"💧", cat:"FOOD"}, {en:"YOGURT", img:"yogurt.png", isImage: true, cat:"FOOD"},
    {en:"ARM", img:"💪", cat:"BODY"}, {en:"HAIR", img:"💇", cat:"BODY"}, {en:"HAND", img:"🖐️", cat:"BODY"},
    {en:"HEAD", img:"👤", cat:"BODY"}, {en:"KNEE", img:"knee.png", isImage: true, cat:"BODY"},
    {en:"EYES", img:"eyes.png", isImage: true, cat:"BODY"}, {en:"FEET", img:"feet.png", isImage: true, cat:"BODY"},
    {en:"LEG", img:"🦵", cat:"BODY"}, {en:"MOUTH", img:"👄", cat:"BODY"}, {en:"NOSE", img:"👃", cat:"BODY"},
    {en:"TOES", img:"toes.png", isImage: true, cat:"BODY"},
    {en:"BABY", img:"👶", cat:"FAMILY"}, {en:"BROTHER", img:"👦", cat:"FAMILY"}, {en:"DAD", img:"👨", cat:"FAMILY"},
    {en:"MUM", img:"👩", cat:"FAMILY"}, {en:"SISTER", img:"👧", cat:"FAMILY"}, {en:"GRANNY", img:"👵", cat:"FAMILY"},
    {en:"GRANDAD", img:"👴", cat:"FAMILY"},
    {en:"BIN", img:"🗑️", cat:"SCHOOL"}, {en:"BOOK", img:"📖", cat:"SCHOOL"}, {en:"CHAIR", img:"🪑", cat:"SCHOOL"},
    {en:"CRAYON", img:"🖍️", cat:"SCHOOL"}, {en:"GLUE", img:"glue.png", isImage: true, cat:"SCHOOL"},
    {en:"PEN", img:"🖊️", cat:"SCHOOL"}, {en:"PENCIL", img:"✏️", cat:"SCHOOL"},
    {en:"PENCIL CASE", img:"pencil case.png", isImage: true, cat:"SCHOOL"},
    {en:"RUBBER", img:"rubber.png", isImage: true, cat:"SCHOOL"}, {en:"RULER", img:"📏", cat:"SCHOOL"},
    {en:"SCHOOL BAG", img:"🎒", cat:"SCHOOL"}, {en:"SHARPENER", img:"sharpener.png", isImage: true, cat:"SCHOOL"},
    {en:"CAT", img:"🐱", cat:"ANIMALS"}, {en:"DOG", img:"🐶", cat:"ANIMALS"}, {en:"MOUSE", img:"🐭", cat:"ANIMALS"},
    {en:"PARROT", img:"🦜", cat:"ANIMALS"}, {en:"RABBIT", img:"🐰", cat:"ANIMALS"}, {en:"SNAKE", img:"🐍", cat:"ANIMALS"},
    {en:"SPIDER", img:"🕷️", cat:"ANIMALS"}, {en:"FISH", img:"🐠", cat:"ANIMALS"}, {en:"MONKEY", img:"🐒", cat:"ANIMALS"},
    {en:"HORSE", img:"🐎", cat:"ANIMALS"},
    {en:"BALL", img:"⚽", cat:"TOYS"}, {en:"CAR", img:"🚗", cat:"TOYS"}, {en:"DOLL", img:"🪆", cat:"TOYS"},
    {en:"PLANE", img:"✈️", cat:"TOYS"}, {en:"ROBOT", img:"🤖", cat:"TOYS"}, {en:"SCOOTER", img:"🛴", cat:"TOYS"},
    {en:"TEDDY", img:"🧸", cat:"TOYS"}, {en:"GAME CONSOLE", img:"🎮", cat:"TOYS"}, {en:"TRAIN", img:"🚂", cat:"TOYS"},
    {en:"DINOSAUR", img:"🦖", cat:"TOYS"}, {en:"KITE", img:"🪁", cat:"TOYS"},
    {en:"BIG", img:"big.png", isImage: true, cat:"TOYS"}, {en:"SMALL", img:"small.png", isImage: true, cat:"TOYS"},
    {en:"BORED", img:"😪", cat:"FEELINGS"}, {en:"HAPPY", img:"😊", cat:"FEELINGS"}, {en:"HUNGRY", img:"🤤", cat:"FEELINGS"},
    {en:"SAD", img:"😢", cat:"FEELINGS"}, {en:"SCARED", img:"😨", cat:"FEELINGS"},
    {en:"BLUE", img:"🔵", cat:"COLOURS"}, {en:"PINK", img:"🩷", cat:"COLOURS"}, {en:"PURPLE", img:"💜", cat:"COLOURS"},
    {en:"YELLOW", img:"💛", cat:"COLOURS"}, {en:"RED", img:"🔴", cat:"COLOURS"}, {en:"GREEN", img:"🟢", cat:"COLOURS"},
    {en:"BLACK", img:"⚫", cat:"COLOURS"}, {en:"WHITE", img:"⚪", cat:"COLOURS"}, {en:"BROWN", img:"🟤", cat:"COLOURS"},
    {en:"GREY", img:"🩶", cat:"COLOURS"}, {en:"ORANGE", img:"🟠", cat:"COLOURS"},
    {en:"ONE", img:"1️⃣", cat:"NUMBERS"}, {en:"TWO", img:"2️⃣", cat:"NUMBERS"}, {en:"THREE", img:"3️⃣", cat:"NUMBERS"},
    {en:"FOUR", img:"4️⃣", cat:"NUMBERS"}, {en:"FIVE", img:"5️⃣", cat:"NUMBERS"}, {en:"SIX", img:"6️⃣", cat:"NUMBERS"},
    {en:"SEVEN", img:"7️⃣", cat:"NUMBERS"}, {en:"EIGHT", img:"8️⃣", cat:"NUMBERS"}, {en:"NINE", img:"9️⃣", cat:"NUMBERS"},
    {en:"TEN", img:"🔟", cat:"NUMBERS"}
];

let currentList = [], currentIndex = 0, isFlipped = false, errorList = [];
let gameMode = 'IMG-EN', isExamMode = false;
let seconds = 0, timerInterval = null, correct = 0, wrong = 0, currentStreak = 0;

const ui = {
    card: document.getElementById("flashcard"),
    imgFront: document.getElementById("imgFront"),
    textFront: document.getElementById("textFront"),
    imgBack: document.getElementById("imgBack"),
    textBack: document.getElementById("textBack"),
    faceFront: document.getElementById("faceFront"),
    faceBack: document.getElementById("faceBack"),
    counter: document.getElementById("counterDisplay"),
    progressBar: document.getElementById("progressBar"),
    examBar: document.getElementById("examBar"),
    timer: document.getElementById("timer"),
    scoreCorrect: document.getElementById("scoreCorrect"),
    scoreWrong: document.getElementById("scoreWrong"),
    streak: document.getElementById("streak"),
    examActions: document.getElementById("examActions"),
    mixPanel: document.getElementById("mixPanel"),
    mixCheckboxes: document.getElementById("mixCheckboxes"),
    catSelect: document.getElementById("categorySelect")
};

const categoryOrder = [
    { name: "COLOURS", emoji: "🎨" }, { name: "NUMBERS", emoji: "🔢" },
    { name: "FAMILY", emoji: "👨‍👩‍👧" }, { name: "FEELINGS", emoji: "❤️" },
    { name: "SCHOOL", emoji: "🎒" }, { name: "ANIMALS", emoji: "🐶" },
    { name: "TOYS", emoji: "⚽" }, { name: "BODY", emoji: "💪" },
    { name: "FOOD", emoji: "🍎" }
];

let audioCtx = null;
function playBeep(freq, dur) {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function initCategories() {
    categoryOrder.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.name; opt.textContent = `${cat.emoji} ${cat.name}`;
        ui.catSelect.appendChild(opt);
        const cb = `<div style="margin:5px 0;"><input type="checkbox" value="${cat.name}" id="cb_${cat.name}"> <label for="cb_${cat.name}">${cat.emoji} ${cat.name}</label></div>`;
        ui.mixCheckboxes.innerHTML += cb;
    });
}

function setMode(mode) {
    gameMode = mode;
    document.getElementById("btnImgEn").classList.toggle("active", mode === 'IMG-EN');
    document.getElementById("btnEnImg").classList.toggle("active", mode === 'EN-IMG');
    resetCardFace(); updateUI();
}

function toggleExamMode() {
    isExamMode = !isExamMode;
    document.getElementById("btnExam").classList.toggle("active", isExamMode);
    ui.examBar.style.display = isExamMode ? "flex" : "none";
    ui.examActions.style.display = isExamMode ? "flex" : "none";
    if(isExamMode) startExam(); else resetExam();
}

function startExam() {
    resetExam();
    timerInterval = setInterval(() => {
        seconds++;
        ui.timer.textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    }, 1000);
    changeCategory();
}

function resetExam() {
    clearInterval(timerInterval);
    seconds = 0; correct = 0; wrong = 0; currentStreak = 0; errorList = [];
    ui.scoreCorrect.textContent = "0"; ui.scoreWrong.textContent = "0"; ui.streak.textContent = "0";
}

function markResult(isCorrect) {
    if(isCorrect) { correct++; currentStreak++; playBeep(880, 0.1); }
    else { wrong++; currentStreak = 0; errorList.push(currentList[currentIndex]); playBeep(220, 0.3); }
    ui.scoreCorrect.textContent = correct; ui.scoreWrong.textContent = wrong; ui.streak.textContent = currentStreak;
    if(currentIndex === currentList.length - 1) finishExam(); else nextCard();
}

function finishExam() {
    clearInterval(timerInterval);
    if(errorList.length > 0 && confirm("Finish! Review mistakes?")) {
        currentList = [...errorList]; currentIndex = 0; errorList = []; resetCardFace(); updateUI();
    } else toggleExamMode();
}

function handleCategoryChange() {
    ui.mixPanel.style.display = (ui.catSelect.value === "MIXED") ? "block" : "none";
    if(ui.catSelect.value !== "MIXED") changeCategory();
}

function changeCategory() {
    const val = ui.catSelect.value;
    let selectedCats = [];
    if(val === "ALL") selectedCats = categoryOrder.map(c => c.name);
    else if (val === "MIXED") {
        selectedCats = Array.from(ui.mixCheckboxes.querySelectorAll('input:checked')).map(cb => cb.value);
        if(!selectedCats.length) return alert("Pick at least one category!");
        ui.mixPanel.style.display = "none";
    } else selectedCats = [val];
    
    currentList = vocab.filter(v => selectedCats.includes(v.cat)).sort(() => Math.random() - 0.5);
    currentIndex = 0; resetCardFace(); updateUI();
}

function updateUI() {
    if(!currentList.length) return;
    const item = currentList[currentIndex];
    ui.imgFront.innerHTML = ""; ui.textFront.textContent = "";
    ui.imgBack.innerHTML = ""; ui.textBack.textContent = "";

    if(gameMode === 'IMG-EN') {
        ui.faceFront.className = 'card-face front face-img';
        renderContent(ui.imgFront, item);
        ui.faceBack.className = 'card-face back face-word';
        ui.textBack.textContent = item.en;
    } else {
        ui.faceFront.className = 'card-face front face-word';
        ui.textFront.textContent = item.en;
        ui.faceBack.className = 'card-face back face-img';
        renderContent(ui.imgBack, item);
    }
    ui.counter.textContent = `${currentIndex + 1} / ${currentList.length}`;
    ui.progressBar.style.width = `${((currentIndex + 1) / currentList.length) * 100}%`;
}

function renderContent(container, item) {
    if(item.isImage) container.innerHTML = `<img src="${item.img}">`;
    else container.textContent = item.img;
}

function flipCard() {
    isFlipped = !isFlipped;
    ui.card.classList.toggle("is-flipped", isFlipped);
    if(isFlipped) setTimeout(playCurrentAudio, 200);
}

function playCurrentAudio() {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(currentList[currentIndex].en);
    msg.lang = "en-GB"; msg.rate = 0.9;
    window.speechSynthesis.speak(msg);
}

function resetCardFace() { isFlipped = false; ui.card.classList.remove("is-flipped"); }
function nextCard() { if(currentIndex < currentList.length - 1) { currentIndex++; resetCardFace(); setTimeout(updateUI, 150); } }
function prevCard() { if(currentIndex > 0) { currentIndex--; resetCardFace(); setTimeout(updateUI, 150); } }

initCategories();
changeCategory();
</script>
</body>

</html>
